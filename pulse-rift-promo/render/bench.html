<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/pulse-rift-promo/node_modules/three/build/three.module.js","three/addons/":"/pulse-rift-promo/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1920, H = 1080;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05020c, 0.02);
const camera = new THREE.PerspectiveCamera(60, W / H, 0.1, 500);
camera.position.set(0, 6, 24);

const N = 60000;
const geo = new THREE.BufferGeometry();
const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
  const r = 20 + Math.random() * 120, a = Math.random() * Math.PI * 2;
  pos[i*3] = Math.cos(a) * r; pos[i*3+1] = (Math.random()-0.5)*80; pos[i*3+2] = Math.sin(a) * r;
  const c = new THREE.Color().setHSL(0.5 + Math.random()*0.3, 1, 0.6);
  col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
}
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
const mat = new THREE.PointsMaterial({ size: 0.35, vertexColors: true, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
scene.add(new THREE.Points(geo, mat));

const torus = new THREE.Mesh(new THREE.TorusKnotGeometry(8, 1.2, 300, 32), new THREE.MeshStandardMaterial({ color: 0x37f5ff, emissive: 0x37f5ff, emissiveIntensity: 1.5, metalness: 0.9, roughness: 0.2 }));
scene.add(torus);
const grid = new THREE.GridHelper(200, 80, 0xff2e88, 0x1d2b4a); scene.add(grid);
const pl = new THREE.PointLight(0xff2e88, 800, 200); pl.position.set(20, 20, 10); scene.add(pl);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.9, 0.6, 0.1);
composer.addPass(bloom);
composer.addPass(new OutputPass());

window.renderAt = (t) => {
  camera.position.x = Math.sin(t * 0.2) * 20;
  camera.lookAt(0, 0, 0);
  torus.rotation.x = t * 0.3; torus.rotation.y = t * 0.5;
  composer.render();
};
window.glInfo = () => {
  const gl = renderer.getContext();
  const ext = gl.getExtension('WEBGL_debug_renderer_info');
  return ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : 'unknown';
};
window.renderAt(0);
window.ready = true;
</script>
</body></html>
